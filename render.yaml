services:
  # Backend API Service
  - type: web
    name: pet-care-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  # Frontend Static Site
  - type: static
    name: pet-care-frontend
    env: static
    buildCommand: cd public && npm install && npm run build
    staticPublishPath: ./public/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
